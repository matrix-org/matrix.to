server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # img-src/connect-src are wide open because clients (built-in, build-time custom, or
    # runtime-registered - see runtime-clients/README.md) can point at arbitrary third-party
    # icons and homeservers. script-src stays same-origin only: dynamic import() of a
    # runtime-registered client module doesn't need 'unsafe-eval'/'unsafe-inline' for that.
    #
    # nginx does not inherit add_header into a location block that sets its own add_header,
    # so this is repeated in the /runtime-clients/ location below rather than relied on here.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src * data:; connect-src *; font-src 'self'; manifest-src 'self'; form-action 'self'; object-src 'none'; base-uri 'self';";
    add_header Content-Security-Policy $csp always;

    location / {
        try_files $uri $uri/ =404;
    }

    # runtime-registered clients are edited in place (no rebuild) - make sure operator
    # changes are picked up on the next load rather than served stale from cache.
    location /runtime-clients/ {
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
